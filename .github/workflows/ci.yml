name: CI

on:
  # Feature branches (same-repo or forks) are covered by the pull_request
  # event; running push for them too would duplicate every PR run. Push
  # runs only on main so merges are still tested.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Toolchain comes from the threehymns/v fork (branch dev), which
      # carries patches stock releases lack (sokol Wayland Shift+letter
      # fold, V3 forward-typedef fix). It is built from source and cached
      # per fork commit under an exact key, so a stale toolchain is never
      # used. See README "Forks & upstream".
      - name: Resolve fork toolchain commit
        id: vfork
        shell: bash
        run: |
          sha=$(git ls-remote https://github.com/threehymns/v.git refs/heads/dev | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore cached toolchain
        id: vcache
        uses: actions/cache@v4
        with:
          path: ~/v-fork
          key: v-fork-${{ runner.os }}-${{ steps.vfork.outputs.sha }}

      - name: Setup V
        shell: bash
        if: steps.vcache.outputs.cache-hit != 'true'
        run: |
          rm -rf ~/v-fork
          git clone --depth 1 --branch dev \
            "https://github.com/threehymns/v.git" \
            ~/v-fork
          make -C ~/v-fork
          # Slim the tree before it is cached: bootstrap sources and git
          # metadata are never read at toolchain runtime.
          rm -rf ~/v-fork/.git ~/v-fork/vc

      - name: Add toolchain to PATH
        shell: bash
        run: |
          echo "$HOME/v-fork" >> "$GITHUB_PATH"
          "$HOME/v-fork/v" version

      # The ui2 fork is a submodule: without it `import ui2` does not resolve.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --quiet -y --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libasound2-dev

      - name: Build
        run: make build

      - name: Test
        # Headless-safe: the suite never opens a window, and the test target
        # does not enable the Wayland backend, so no display server is needed.
        run: make test
