name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Build the toolchain from the threehymns/v fork (branch dev), which
      # carries patches stock releases lack (sokol Wayland Shift+letter
      # fold, V3 forward-typedef fix). Building from source also proves the
      # fork itself still bootstraps. See README "Forks & upstream".
      - name: Setup V
        shell: bash
        run: |
          git clone --depth 1 --branch dev \
            "https://github.com/threehymns/v.git" \
            "$RUNNER_TEMP/vlang"
          make -C "$RUNNER_TEMP/vlang"
          echo "$RUNNER_TEMP/vlang" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/vlang/v" version

      # The ui2 fork is a submodule: without it `import ui2` does not resolve.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --quiet -y --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libasound2-dev

      - name: Build
        run: make build

      - name: Test
        # Headless-safe: the suite never opens a window, and the test target
        # does not enable the Wayland backend, so no display server is needed.
        run: make test
